[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navigator"
version = "0.1.0"
description = "Philosophical Navigator — retrieval MVP (Milestone 1: canonical corpus + schemas + validation)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
navigator = "navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
